name: weather-etl
services:
  weather-db:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_DB: ${WEATHER_DB_NAME:-weather}
      POSTGRES_USER: ${WEATHER_DB_USER:-weather}
      POSTGRES_PASSWORD: ${WEATHER_DB_PASSWORD:?Set WEATHER_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${WEATHER_DB_PORT:-5433}:5432"
    volumes:
      - weather_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
volumes:
  weather_pgdata:
